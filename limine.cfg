# Timeout in seconds that Limine will use before automatically booting.
TIMEOUT=1

# The entry name that will be displayed in the boot menu.
:Choco OS
    # We use the Limine boot protocol.
    PROTOCOL=limine

    # Disable KASLR (it is enabled by default for relocatable kernels)
    KASLR=no

    # Path to the kernel to boot. boot:/// represents the partition on which limine.cfg is located.
    KERNEL_PATH=boot:///boot/kernel

    # Root filesystem contents.
    MODULE_PATH=boot:///boot/initrd.tar

    # LLM model weights + tokenizers (fetched by `gmake models`).
    MODULE_PATH=boot:///boot/stories15M.bin
    MODULE_PATH=boot:///boot/stories260K.bin
    MODULE_PATH=boot:///boot/tokenizer.bin
    MODULE_PATH=boot:///boot/tok512.bin
